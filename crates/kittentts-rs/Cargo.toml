[package]
name = "kittentts-rs"
description = "Native KittenTTS ONNX inference, text pipeline and bounded TTS queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["onnx-download"]
# ONNX Runtime binaries are downloaded and bundled at build time (desktop).
onnx-download = ["ort/download-binaries", "ort/tls-rustls"]
# Load ONNX Runtime from a shared library at run time (Android / custom deploys).
onnx-dynamic = ["ort/load-dynamic"]

[dependencies]
any_ascii.workspace = true
base64.workspace = true
npyz.workspace = true
ort.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
