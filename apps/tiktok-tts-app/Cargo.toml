[package]
name = "tiktok-tts-app"
description = "Yapper: TikTok LIVE chat to local neural TTS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "tiktok-tts-app"

[features]
default = ["desktop", "onnx"]
desktop = ["dep:tauri"]
onnx = ["kittentts-rs/onnx-download"]
onnx-dynamic = ["kittentts-rs/onnx-dynamic"]

[dependencies]
axum.workspace = true
base64.workspace = true
kittentts-rs = { path = "../../crates/kittentts-rs", default-features = false }
serde.workspace = true
serde_json.workspace = true
tiklive-rs = { path = "../../crates/tiklive-rs" }
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
