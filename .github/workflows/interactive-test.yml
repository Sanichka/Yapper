name: Interactive GUI Test (macOS / iOS / Linux)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target OS to test'
        required: true
        default: 'macos-15'
        type: choice
        options:
          - macos-15
          - macos-26
          - ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/tiktok-tts-app/ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ startsWith(inputs.os, 'macos') && 'macos-arm64' || 'linux-x64' }}
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libasound2-dev \
            patchelf

      - name: Build frontend UI
        run: |
          npm ci --prefix apps/tiktok-tts-app/ui
          npm run build --prefix apps/tiktok-tts-app/ui

      - name: Build tiktok-tts-app binary
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.4"
          RUSTFLAGS: ${{ runner.os == 'macOS' && '-C link-arg=-mmacosx-version-min=13.4' || '' }}
        run: |
          cargo build --release -p tiktok-tts-app

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-tts-app-${{ inputs.os }}
          path: target/release/tiktok-tts-app
          if-no-files-found: error
          retention-days: 1

  interactive-gui:
    name: Interactive GUI (${{ inputs.os }})
    needs: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: tiktok-tts-app-${{ inputs.os }}
          path: .

      - name: Prepare binary
        shell: bash
        run: |
          chmod +x ./tiktok-tts-app
          mkdir -p target/release
          cp ./tiktok-tts-app target/release/tiktok-tts-app
          ls -la ./tiktok-tts-app

      - name: Start Browser VNC Session (macOS + iOS Simulator)
        if: runner.os == 'macOS'
        env:
          VNC_USER: vncuser
          VNC_PASS: yapper12
        run: |
          # 1. Install cloudflared and clone noVNC-ARD (supports macOS Screen Sharing / ARD protocol)
          brew install cloudflared
          git clone --depth 1 --recurse-submodules https://github.com/peetinc/noVNC-ARD.git /tmp/novnc
          git clone --depth 1 https://github.com/novnc/websockify.git /tmp/websockify
          chmod +x /tmp/websockify/run

          # Ensure vnc.html and index.html are available
          if [ -f /tmp/novnc/noVNC/vnc.html ]; then
            cp /tmp/novnc/noVNC/vnc.html /tmp/novnc/vnc.html
          elif [ ! -f /tmp/novnc/vnc.html ]; then
            cp /tmp/novnc/ard.html /tmp/novnc/vnc.html
          fi
          cp /tmp/novnc/ard.html /tmp/novnc/index.html

          # Inject parameter normalizer script into HTML heads:
          # Auto-fills username, handles 'pass'/'pwd', replaces GitHub log-masked '***' with true password,
          # and ensures autoconnect + resize=scale are set before noVNC initializes.
          python3 -c "
          import os
          script = '''<script>
          const p = new URLSearchParams(window.location.search);
          let c = false;
          if (!p.get('username')) { p.set('username', '${VNC_USER}'); c = true; }
          if (!p.get('password') || p.get('password') === '***') { p.set('password', p.get('pass') || p.get('pwd') || '${VNC_PASS}'); c = true; }
          if (!p.get('autoconnect')) { p.set('autoconnect', 'true'); c = true; }
          if (!p.get('resize')) { p.set('resize', 'scale'); c = true; }
          if (c && window.history.replaceState) { window.history.replaceState({}, '', window.location.pathname + '?' + p.toString()); }
          window.addEventListener('DOMContentLoaded', () => {
            setInterval(() => {
              const userInput = document.getElementById('noVNC_username_input') || document.querySelector('input[type=text]');
              const passInput = document.getElementById('noVNC_password_input') || document.querySelector('input[type=password]');
              if (userInput && !userInput.value) { userInput.value = '${VNC_USER}'; }
              if (passInput && !passInput.value) { passInput.value = '${VNC_PASS}'; }
            }, 500);
          });
          </script>'''
          for fpath in ['/tmp/novnc/ard.html', '/tmp/novnc/vnc.html', '/tmp/novnc/index.html']:
              if os.path.exists(fpath):
                  with open(fpath, 'r', encoding='utf-8') as f:
                      content = f.read()
                  if '<head>' in content and 'URLSearchParams' not in content:
                      content = content.replace('<head>', '<head>\n' + script)
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(content)
          "

          # 2. Create fresh local admin user with known password (avoids eDSAuthFailed on runner)
          echo "Setting up dedicated local user '$VNC_USER'..."
          sudo dscl . -delete /Users/"$VNC_USER" >/dev/null 2>&1 || true
          sudo dscl . -create /Users/"$VNC_USER"
          sudo dscl . -create /Users/"$VNC_USER" UserShell /bin/bash
          sudo dscl . -create /Users/"$VNC_USER" RealName "VNC User"
          sudo dscl . -create /Users/"$VNC_USER" UniqueID 1001
          sudo dscl . -create /Users/"$VNC_USER" PrimaryGroupID 80
          sudo dscl . -create /Users/"$VNC_USER" NFSHomeDirectory /Users/"$VNC_USER"
          sudo dscl . -passwd /Users/"$VNC_USER" "$VNC_PASS"
          sudo dseditgroup -o edit -a "$VNC_USER" -t user admin || true
          sudo dscl . -append /Groups/admin GroupMembership "$VNC_USER" || true
          sudo createhomedir -c -u "$VNC_USER" >/dev/null 2>&1 || true

          # Verify authentication locally
          echo "Verifying local authentication for $VNC_USER..."
          if sudo dscl . -authonly "$VNC_USER" "$VNC_PASS"; then
            echo "✅ Local authentication check succeeded for $VNC_USER"
          else
            echo "⚠️ Local authentication check failed, reapplying passwd..."
            sudo dscl . -passwd /Users/"$VNC_USER" "$VNC_PASS"
          fi

          # Prevent display sleep and wake session (fixes headless black screen)
          sudo defaults write com.apple.screensaver askForPassword -int 0 2>/dev/null || true
          sudo defaults write com.apple.screensaver loginWindowIdleTime 0 2>/dev/null || true
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 2>/dev/null || true
          caffeinate -u -d -t 3600 &

          # Reset TCC screen capture cache so Remote Management is not blocked
          sudo tccutil reset ScreenCapture 2>/dev/null || true

          # 3. Enable launchd screensharing daemon explicitly
          sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          # 4. Write obfuscated legacy VNC password (strictly <= 8 chars for RFB DES auth)
          echo -n "$VNC_PASS" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "\%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
          sudo chmod 400 /Library/Preferences/com.apple.VNCSettings.txt

          # 5. Activate Apple Remote Desktop with legacy VNC and prompt disabled
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -users "$VNC_USER",runner -privs -all \
            -configure -allowAccessFor -allUsers -privs -all \
            -configure -clientopts -setreqperm -reqperm no -setmenuextra -menuextra yes -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASS" \
            -restart -agent -console

          # Background watcher to auto-accept any Screen Sharing / Remote Management prompts
          (
            while true; do
              osascript -e '
                tell application "System Events"
                  repeat with p in {"Screen Sharing", "ScreenSharingAgent", "SecurityAgent", "System Events", "UserNotificationCenter"}
                    try
                      tell process p
                        repeat with b in {"Share Display", "Share", "Accept", "Allow", "Connect", "OK"}
                          try
                            click button b of window 1
                          end try
                        end repeat
                      end tell
                    end try
                  end repeat
                end tell
              ' 2>/dev/null || true
              sleep 1
            done
          ) &
          AUTO_CLICK_PID=$!

          # 6. Verify local VNC port 5900 is listening
          echo "Verifying local VNC is listening on port 5900..."
          for i in {1..15}; do
            if nc -z 127.0.0.1 5900; then
              echo "macOS VNC server is listening on port 5900"
              break
            fi
            sleep 1
          done

          # 7. Boot available iOS Simulator and launch Yapper
          echo "Detecting available iOS simulator..."
          SIMULATOR_UDID=$(xcrun simctl list devices available | grep -E 'iPhone|iPad' | grep -v 'unavailable' | head -n 1 | awk -F '[()]' '{print $(NF-1)}' || true)
          if [ -n "$SIMULATOR_UDID" ]; then
            echo "Booting simulator with UDID: $SIMULATOR_UDID"
            xcrun simctl boot "$SIMULATOR_UDID" || true
          else
            echo "No specific iPhone simulator found, attempting boot by name"
            xcrun simctl boot "iPhone 16" || xcrun simctl boot "iPhone 15" || true
          fi
          open -a Simulator || true
          ./tiktok-tts-app &

          # Wake display and activate windows
          open -a Finder || true
          osascript -e 'tell application "System Events" to key code 123' 2>/dev/null || true
          osascript -e 'tell application "Simulator" to activate' 2>/dev/null || true

          # 8. Start websockify proxy for noVNC-ARD on port 6080 (run is a shell script, not python)
          /tmp/websockify/run --web /tmp/novnc 6080 127.0.0.1:5900 &
          WEBSOCKIFY_PID=$!

          echo "Verifying noVNC-ARD proxy is listening on port 6080..."
          for i in {1..15}; do
            if nc -z 127.0.0.1 6080; then
              echo "noVNC-ARD proxy is ready on port 6080"
              break
            fi
            sleep 1
          done

          # 9. Start Cloudflare Tunnel with timeout wrapper (connect to 127.0.0.1:6080)
          if command -v timeout >/dev/null 2>&1; then
            timeout 25m cloudflared tunnel --url http://127.0.0.1:6080 > /tmp/cloudflared.log 2>&1 &
          else
            cloudflared tunnel --url http://127.0.0.1:6080 > /tmp/cloudflared.log 2>&1 &
          fi
          TUNNEL_PID=$!

          # 10. Extract tunnel URL and print direct one-click link
          echo "Waiting for Cloudflare Quick Tunnel URL..."
          TUNNEL_URL=""
          for i in {1..30}; do
            if [ -f /tmp/cloudflared.log ]; then
              TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then
                break
              fi
            fi
            sleep 1
          done

          if [ -n "$TUNNEL_URL" ]; then
            ONE_CLICK_URL="${TUNNEL_URL}/ard.html?autoconnect=true&resize=scale&username=${VNC_USER}&pass=${VNC_PASS}"
            FALLBACK_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=scale&pass=${VNC_PASS}"
            echo "================================================================================"
            echo "🎉 INTERACTIVE GUI SESSION IS READY (macOS)!"
            echo ""
            echo "👉 Direct one-click browser URL (Apple Remote Desktop Web Client):"
            echo "   $ONE_CLICK_URL"
            echo "   (Fallback Standard VNC link: $FALLBACK_URL)"
            echo ""
            echo "   VNC Username: $VNC_USER"
            echo "   VNC Password: $VNC_PASS"
            echo "   Session timeout: 25 minutes (auto-closes if unattended)"
            echo "================================================================================"
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "### 🖥️ Interactive GUI Session is Live (macOS)!" >> "$GITHUB_STEP_SUMMARY"
              echo "- **Direct One-Click URL (ARD Web Client)**: [$ONE_CLICK_URL]($ONE_CLICK_URL)" >> "$GITHUB_STEP_SUMMARY"
              echo "- **Fallback Standard VNC URL**: [$FALLBACK_URL]($FALLBACK_URL)" >> "$GITHUB_STEP_SUMMARY"
              echo "- **VNC Username**: \`$VNC_USER\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- **VNC Password**: \`$VNC_PASS\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Cloudflare tunnel URL could not be detected. Showing cloudflared log:"
            cat /tmp/cloudflared.log || true
          fi

          # 11. Stream tunnel logs and hold session open for up to 25 minutes
          tail -f /tmp/cloudflared.log &
          TAIL_PID=$!

          SECONDS=0
          while kill -0 "$TUNNEL_PID" 2>/dev/null; do
            if [ "$SECONDS" -ge 1500 ]; then
              echo "Session timeout reached (25 minutes). Closing tunnel..."
              kill -TERM "$TUNNEL_PID" 2>/dev/null || true
              break
            fi
            sleep 2
          done
          wait "$TUNNEL_PID" 2>/dev/null || true
          kill -TERM "$WEBSOCKIFY_PID" 2>/dev/null || true
          kill -TERM "$TAIL_PID" 2>/dev/null || true
          kill -TERM "$AUTO_CLICK_PID" 2>/dev/null || true

      - name: Start Browser VNC Session (Linux)
        if: runner.os == 'Linux'
        env:
          VNC_PASS: yapper12
        run: |
          # 1. Install runtime dependencies and display tools
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            fluxbox \
            x11vnc \
            novnc \
            websockify \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            curl \
            net-tools

          # 2. Install cloudflared if not already available
          if ! command -v cloudflared >/dev/null 2>&1; then
            echo "Installing cloudflared..."
            sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
            sudo chmod +x /usr/local/bin/cloudflared
          fi

          # 3. Start Xvfb virtual display
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2

          # 4. Start lightweight window manager
          fluxbox &
          sleep 1

          # 5. Launch Yapper desktop app
          ./tiktok-tts-app &

          # 6. Configure VNC password and start x11vnc
          mkdir -p ~/.vnc
          x11vnc -storepasswd "$VNC_PASS" ~/.vnc/passwd
          x11vnc -display :99 -rfbauth ~/.vnc/passwd -forever -shared -bg -rfbport 5900

          echo "Verifying local VNC is listening on port 5900..."
          for i in {1..15}; do
            if nc -z 127.0.0.1 5900; then
              echo "Linux VNC server is ready on port 5900."
              break
            fi
            sleep 1
          done

          # 7. Ensure vnc.html exists in novnc web directory and inject auto-auth helper
          NOVNC_DIR="/usr/share/novnc"
          if [ -d "$NOVNC_DIR" ] && [ ! -f "$NOVNC_DIR/vnc.html" ]; then
            if [ -f "$NOVNC_DIR/vnc_lite.html" ]; then
              sudo cp "$NOVNC_DIR/vnc_lite.html" "$NOVNC_DIR/vnc.html" || true
            elif [ -f "$NOVNC_DIR/index.html" ]; then
              sudo cp "$NOVNC_DIR/index.html" "$NOVNC_DIR/vnc.html" || true
            fi
          fi

          # Inject parameter normalizer script to avoid password masking
          sudo python3 -c "
          import os
          script = '''<script>
          const p = new URLSearchParams(window.location.search);
          let c = false;
          if (!p.get('password') || p.get('password') === '***') { p.set('password', p.get('pass') || p.get('pwd') || '${VNC_PASS}'); c = true; }
          if (!p.get('autoconnect')) { p.set('autoconnect', 'true'); c = true; }
          if (c && window.history.replaceState) { window.history.replaceState({}, '', window.location.pathname + '?' + p.toString()); }
          </script>'''
          for fpath in ['$NOVNC_DIR/vnc.html', '$NOVNC_DIR/index.html', '$NOVNC_DIR/vnc_lite.html']:
              if os.path.exists(fpath):
                  with open(fpath, 'r', encoding='utf-8') as f:
                      content = f.read()
                  if '<head>' in content and 'URLSearchParams' not in content:
                      content = content.replace('<head>', '<head>\n' + script)
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(content)
          " 2>/dev/null || true

          # 8. Start websockify proxy for noVNC on port 6080
          websockify --web="$NOVNC_DIR" 6080 127.0.0.1:5900 &

          echo "Verifying noVNC proxy is listening on port 6080..."
          for i in {1..15}; do
            if nc -z 127.0.0.1 6080; then
              echo "noVNC proxy is ready on port 6080."
              break
            fi
            sleep 1
          done

          # 9. Start Cloudflare Tunnel with timeout wrapper (connect to 127.0.0.1:6080)
          if command -v timeout >/dev/null 2>&1; then
            timeout 25m cloudflared tunnel --url http://127.0.0.1:6080 > /tmp/cloudflared.log 2>&1 &
          else
            cloudflared tunnel --url http://127.0.0.1:6080 > /tmp/cloudflared.log 2>&1 &
          fi
          TUNNEL_PID=$!

          # 10. Extract tunnel URL and print direct one-click link
          echo "Waiting for Cloudflare Quick Tunnel URL..."
          TUNNEL_URL=""
          for i in {1..30}; do
            if [ -f /tmp/cloudflared.log ]; then
              TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then
                break
              fi
            fi
            sleep 1
          done

          if [ -n "$TUNNEL_URL" ]; then
            ONE_CLICK_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&pass=${VNC_PASS}"
            echo "================================================================================"
            echo "🎉 INTERACTIVE GUI SESSION IS READY (Linux)!"
            echo ""
            echo "👉 Direct one-click browser URL:"
            echo "   $ONE_CLICK_URL"
            echo ""
            echo "   VNC Password: $VNC_PASS"
            echo "   Session timeout: 25 minutes (auto-closes if unattended)"
            echo "================================================================================"
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "### 🖥️ Interactive GUI Session is Live (Linux)!" >> "$GITHUB_STEP_SUMMARY"
              echo "- **Direct One-Click URL**: [$ONE_CLICK_URL]($ONE_CLICK_URL)" >> "$GITHUB_STEP_SUMMARY"
              echo "- **VNC Password**: \`$VNC_PASS\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Cloudflare tunnel URL could not be detected. Showing cloudflared log:"
            cat /tmp/cloudflared.log || true
          fi

          # 11. Stream tunnel logs and hold session open for up to 25 minutes
          tail -f /tmp/cloudflared.log &
          TAIL_PID=$!

          SECONDS=0
          while kill -0 "$TUNNEL_PID" 2>/dev/null; do
            if [ "$SECONDS" -ge 1500 ]; then
              echo "Session timeout reached (25 minutes). Closing tunnel..."
              kill -TERM "$TUNNEL_PID" 2>/dev/null || true
              break
            fi
            sleep 2
          done
          wait "$TUNNEL_PID" 2>/dev/null || true
          kill -TERM "$TAIL_PID" 2>/dev/null || true
