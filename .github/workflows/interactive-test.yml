name: Interactive GUI Test (macOS / iOS / Linux)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target OS to test'
        required: true
        default: 'macos-14'
        type: choice
        options:
          - macos-14
          - ubuntu-24.04

jobs:
  remote-gui:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Yapper UI & Binary (macOS)
        if: runner.os == 'macOS'
        run: |
          npm --prefix apps/tiktok-tts-app/ui ci
          npm --prefix apps/tiktok-tts-app/ui run build
          cargo build --release

      - name: Start Browser VNC Session (macOS + iOS Simulator)
        if: runner.os == 'macOS'
        run: |
          brew install cloudflared
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          git clone --depth 1 https://github.com/novnc/websockify /tmp/novnc/utils/websockify

          # Налаштовуємо VNC сервер БЕЗ патріольнї авторизації для локального підключення
          sudo defaults write /Library/Preferences/com.apple.VNCSettings.txt DVCAuthRequired -bool false
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -restart -agent -privs -all

          # Запуск симулятора та Yapper
          xcrun simctl boot "iPhone 16" || xcrun simctl boot "iPhone 15" || true
          open -a Simulator
          ./target/release/tiktok-tts-app &

          # Запуск noVNC проксі на порту 6080 без вимогою пароля
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 3

          echo "=========================================="
          echo "OPEN THE .trycloudflare.com LINK AND ADD /vnc.html"
          echo "=========================================="
          cloudflared tunnel --url http://localhost:6080

      - name: Start Browser VNC Session (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fluxbox x11vnc novnc websockify libwebkit2gtk-4.1-dev libasound2-dev

          npm --prefix apps/tiktok-tts-app/ui ci
          npm --prefix apps/tiktok-tts-app/ui run build
          cargo build --release

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          fluxbox &
          ./target/release/tiktok-tts-app &

          x11vnc -display :99 -nopw -forever -shared -bg -rfbport 5900
          websockify --web=/usr/share/novnc 6080 localhost:5900 &

          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080
